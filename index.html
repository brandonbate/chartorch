<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netgui</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-mode="move" data-panel-mode="data">
  <div id="toolbar">
    <button type="button" id="btn-data" class="mode-btn active">Data</button>
    <button type="button" id="btn-training" class="mode-btn">Training</button>
    <div class="toolbar-sep"></div>
    <button type="button" id="btn-move" class="mode-btn active">Move</button>
    <button type="button" id="btn-connect" class="mode-btn">Connect</button>
    <div class="toolbar-sep"></div>
    <div id="module-buttons"></div>
    <div class="toolbar-sep"></div>
    <button type="button" id="btn-generate">Generate</button>
  </div>
  <div id="stage">
    <aside id="settings-panel">
      <div class="panel-body" id="data-panel">
        <h2>Dataset</h2>
        <select id="dataset-type"></select>
        <div id="dataset-sample">
          <div id="dataset-media"></div>
          <div id="dataset-label"></div>
          <div id="dataset-nav">
            <button type="button" id="dataset-prev">Prev</button>
            <button type="button" id="dataset-next">Next</button>
          </div>
          <div class="setting-arg">
            <span class="arg-name">index</span> =
            <input id="dataset-index" type="text" value="0">
          </div>
          <div id="dataset-size"></div>
          <div id="dataset-input-shape"></div>
          <div id="dataset-label-shape"></div>
        </div>
      </div>
      <div class="panel-body" id="training-panel" hidden>
        <h2>Optimizer</h2>
        <select id="optimizer-type"></select>
        <div id="optimizer-args" class="setting-args"></div>
        <h2>Loss</h2>
        <select id="loss-type"></select>
        <div id="loss-args" class="setting-args"></div>
        <h2>Training</h2>
        <div class="setting-arg">
          <span class="arg-name">epochs</span> =
          <input id="epochs-input" type="text">
        </div>
      </div>
      <div class="resize-handle resize-handle-right" id="settings-resize"></div>
    </aside>
    <div id="canvas">
      <div id="workspace">
        <svg id="edges" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z"></path>
            </marker>
            <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z"></path>
            </marker>
          </defs>
        </svg>
        <svg id="preview" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes"></div>
        <div id="ghost" hidden></div>
      </div>
    </div>
    <aside id="generate-panel" hidden>
      <div class="resize-handle resize-handle-left" id="generate-resize"></div>
      <div class="panel-header">
        <span>Generated code</span>
        <button type="button" id="panel-close">Close</button>
      </div>
      <textarea id="generated-code" readonly></textarea>
      <button type="button" id="btn-copy">Copy</button>
    </aside>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
